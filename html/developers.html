    padding:8px 0 12px;

    display:block;
    width:100%;

    flex-wrap:wrap;

  .follow-link {
    display:inline-block;
    align-self:flex-start;

    border-radius:20px;

    color:#fff;
    font-family:Arial,sans-serif;
    font-size:14px;
    font-weight:bold;
    text-decoration:none;

  .follow-link:hover {

  .copyright {

@media (max-width: 780px) {

  .branding .moldis-logo {
    max-width:100%;
    height:auto;
  }
  .branding .tifr-logo {
    max-width:130px;
    height:auto;
  }

  }
  nav a {
    padding:10px 16px;
